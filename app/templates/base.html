<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Eval Gym{% endblock %}</title>
    <style>
        /* One stylesheet, read top to bottom. Two rules explain most of it.
           First, the machine writes in monospace and you write in serif: every
           metric, number, hash and stage token is mono, and every word you
           typed is serif. This app never writes a prediction for you, so that
           difference is worth seeing. Second, the accent colour marks only
           what you got wrong. A correct call gets no colour, because the
           misses are the output worth reading. */

        :root {
            --paper: #f4f6f3;
            --ink: #1b2023;
            --rule: #d2d7d1;
            --faint: #697069;
            --mark: #8a4a00;

            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            --prose: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;

            --gutter: 2.25rem;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 2rem 1rem 6rem;
            background: var(--paper);
            color: var(--ink);
            font: 400 15px/1.45 var(--mono);
            -webkit-text-size-adjust: 100%;
        }

        .sheet { max-width: 60rem; margin: 0 auto; }

        /* Masthead. The app name is the only thing here; a page says what it
           is in its own strip below. */
        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            padding-bottom: 0.35rem;
            border-bottom: 2px solid var(--ink);
        }
        .masthead a { color: inherit; text-decoration: none; }
        .masthead a:hover { text-decoration: underline; }
        .masthead .name { font-weight: 600; letter-spacing: 0.02em; }
        .masthead .where { color: var(--faint); }

        /* The identity strip: what you are looking at, and what stage it is
           in. Stage sits right so it lands in the same place on every page. */
        .strip {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.25rem 0 0.25rem;
        }
        .strip h2 { margin: 0; font: 600 1.15rem/1.25 var(--mono); }
        .target { margin: 0.1rem 0 0; color: var(--faint); word-break: break-all; }
        .target a { color: var(--faint); }

        .stage {
            font-size: 0.85rem;
            color: var(--faint);
            white-space: nowrap;
        }
        .stage::before { content: "["; }
        .stage::after { content: "]"; }

        /* Section headings: sentence case, with the rule running out to the
           right edge so the eye is carried across rather than stopped. */
        h3 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin: 2rem 0 0.75rem;
            font: 600 0.95rem/1.2 var(--mono);
            color: var(--faint);
        }
        h3::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--rule);
        }

        /* Your own words. Everything you typed is set here. */
        .says {
            font: 400 1.0625rem/1.55 var(--prose);
            max-width: 42rem;
            margin: 0.4rem 0;
        }
        .note {
            max-width: 46rem;
            color: var(--faint);
            margin: 0.4rem 0;
        }

        a { color: var(--ink); text-decoration-color: var(--rule); }
        a:hover { text-decoration-color: currentColor; }
        a:focus-visible, button:focus-visible, input:focus-visible,
        textarea:focus-visible, select:focus-visible {
            outline: 2px solid var(--mark);
            outline-offset: 2px;
        }
        .back { display: inline-block; margin: 0 0 0.25rem; color: var(--faint); }
        .back a { color: inherit; }

        /* Rows in a gutter. The gutter carries the index and, for a claim,
           the outcome glyph. The glyph only repeats what the text already
           says, so nothing depends on seeing it. */
        .rows { list-style: none; margin: 0; padding: 0; }
        .rows > li {
            display: grid;
            grid-template-columns: var(--gutter) 1fr;
            gap: 0 0.5rem;
            padding: 0.85rem 0;
            border-top: 1px solid var(--rule);
        }
        .rows > li:last-child { border-bottom: 1px solid var(--rule); }
        .rows > li > .idx {
            color: var(--faint);
            font-size: 0.85rem;
            padding-top: 0.15rem;
        }
        .rows > li > .body > :first-child { margin-top: 0; }
        .rows > li > .body > :last-child { margin-bottom: 0; }

        /* Facts: a label column and a value column, so numbers down the page
           line up and predicted sits directly above measured. */
        .facts { margin: 0.5rem 0 0; display: grid; gap: 0.15rem 1rem; }
        .facts > div {
            display: grid;
            grid-template-columns: 6.5rem 1fr;
            gap: 0 1rem;
            align-items: baseline;
        }
        .facts dt, .facts .k { color: var(--faint); font-size: 0.85rem; }
        .facts dd, .facts .v { margin: 0; }

        code { font: inherit; }
        .num { font-variant-numeric: tabular-nums; }
        .hash { word-break: break-all; color: var(--faint); }
        .when { margin: 0; color: var(--faint); font-size: 0.85rem; }

        /* Outcomes. Umber for wrong, plain ink for correct, drained and
           dashed for a claim nothing measured. */
        .outcome { margin: 0.35rem 0 0; }
        .correct .idx::after { content: "\2713"; display: block; color: var(--ink); }
        .wrong .idx::after { content: "\2717"; display: block; color: var(--mark); }
        .unresolved .idx::after { content: "\00b7"; display: block; color: var(--faint); }
        .wrong .outcome strong { color: var(--mark); }
        .unresolved .outcome strong { color: var(--faint); font-weight: 400; }
        .unresolved .body { opacity: 0.75; }
        .unresolved { border-left: 2px dashed var(--rule); }

        /* A superseded reading stays legible. It was a real measurement, it
           was just replaced, so it is dimmed rather than struck out. */
        .reads { list-style: none; margin: 0.4rem 0 0; padding: 0; }
        .reads li { padding: 0.1rem 0; }
        .reads .was { color: var(--faint); }
        .reads .was code { text-decoration: underline dotted var(--rule); }

        /* The score block, the one place numbers are the content. */
        .tally { margin: 0; }
        .tally > div, .tally dt, .tally dd { }
        dl.tally {
            display: grid;
            grid-template-columns: 9rem 1fr;
            gap: 0.2rem 1rem;
            align-items: baseline;
            margin: 0;
        }
        dl.tally dt { color: var(--faint); font-size: 0.85rem; }
        dl.tally dd { margin: 0; font-size: 1.05rem; font-variant-numeric: tabular-nums; }

        /* Forms. Labels sit above, the field is full width, nothing is
           decorated. A submit that changes something irreversibly says so in
           its own words rather than in a colour. */
        form { display: grid; gap: 0.3rem; max-width: 34rem; margin: 0.75rem 0 0; }
        label { color: var(--faint); font-size: 0.85rem; }
        input, textarea, select {
            font: inherit;
            color: inherit;
            background: #fff;
            border: 1px solid var(--rule);
            padding: 0.4rem 0.5rem;
        }
        textarea { min-height: 5.5rem; font-family: var(--prose); line-height: 1.5; resize: vertical; }
        input:hover, textarea:hover, select:hover { border-color: var(--faint); }
        button {
            font: inherit;
            color: var(--paper);
            background: var(--ink);
            border: 1px solid var(--ink);
            padding: 0.45rem 0.9rem;
            cursor: pointer;
            justify-self: start;
            margin-top: 0.35rem;
        }
        button:hover { background: var(--mark); border-color: var(--mark); }

        pre {
            margin: 0.5rem 0;
            padding: 0.7rem 0.8rem;
            background: #fff;
            border: 1px solid var(--rule);
            overflow-x: auto;
            font: inherit;
        }

        /* The index. One line per cycle, stage on the right. */
        .index { list-style: none; margin: 0; padding: 0; }
        .index li {
            display: grid;
            grid-template-columns: var(--gutter) 1fr auto;
            gap: 0 0.5rem;
            align-items: baseline;
            padding: 0.5rem 0;
            border-top: 1px solid var(--rule);
        }
        .index li:last-child { border-bottom: 1px solid var(--rule); }
        .index .idx { color: var(--faint); font-size: 0.85rem; }

        .onward { margin: 1.5rem 0 0; display: flex; gap: 1.25rem; flex-wrap: wrap; }

        .empty { color: var(--faint); font-style: normal; }

        @media (max-width: 34rem) {
            :root { --gutter: 1.75rem; }
            .facts > div { grid-template-columns: 5.5rem 1fr; }
            dl.tally { grid-template-columns: 7.5rem 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
    <div class="sheet">
        <header class="masthead">
            <span class="name"><a href="/">ai eval gym</a></span>
            <span class="where">{% block where %}{% endblock %}</span>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
