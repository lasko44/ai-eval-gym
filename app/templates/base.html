<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Eval Gym{% endblock %}</title>
    <style>
        /* One stylesheet, read top to bottom.

           This is a place to learn something, so it is set like something you
           read: a sans face at a comfortable size, real headings, and room
           between things. Monospace is reserved for the things that are
           literally code or data, which is metric names, numbers, hashes and
           commands. Everything else is prose. */

        :root {
            --bg: #f5f7f9;
            --surface: #ffffff;
            --ink: #16202a;
            --muted: #5c6b7a;
            --line: #e1e8ee;
            --line-strong: #cbd6e0;
            --accent: #1d4ed8;
            --accent-soft: #eef2ff;
            --good: #15803d;
            --warn: #b45309;

            --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 1rem 7rem;
            background: var(--bg);
            color: var(--ink);
            font: 400 17px/1.65 var(--sans);
            -webkit-font-smoothing: antialiased;
        }

        .sheet { max-width: 48rem; margin: 0 auto; }

        /* Masthead */
        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--line);
        }
        .masthead .name { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
        .masthead .name a { color: var(--ink); text-decoration: none; }
        .masthead .where { color: var(--muted); font-size: 0.9rem; }
        .masthead nav { display: flex; gap: 1.25rem; font-size: 0.95rem; }
        .masthead nav a { color: var(--muted); text-decoration: none; }
        .masthead nav a:hover { color: var(--ink); }

        /* Headings. A page title is obviously a page title. */
        h2 {
            margin: 0;
            font-size: 1.9rem;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        h3 {
            margin: 2.75rem 0 0.75rem;
            font-size: 1.2rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }
        h4 { margin: 1.5rem 0 0.4rem; font-size: 1rem; font-weight: 650; }

        p { margin: 0 0 1rem; }
        .lede { font-size: 1.12rem; color: var(--muted); margin-top: 0.6rem; }
        .note { color: var(--muted); }
        .says { margin: 0 0 0.75rem; }
        .empty { color: var(--muted); }

        a { color: var(--accent); }
        a:hover { color: #1633a8; }
        .back { display: inline-block; margin: 0 0 1rem; font-size: 0.95rem; }
        .back a { color: var(--muted); text-decoration: none; }
        .back a::before { content: "\2190  "; }
        .back a:hover { color: var(--ink); }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

        /* The identity strip at the top of a page. */
        .strip {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .target { margin: 0.4rem 0 0; font-size: 0.95rem; word-break: break-all; }

        .stage {
            flex: none;
            font: 600 0.78rem/1 var(--sans);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--bg);
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            padding: 0.35rem 0.7rem;
            margin-top: 0.35rem;
        }

        /* Cards carry one discrete thing each. */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 1.25rem 1.4rem;
            margin: 1rem 0;
        }
        .card > :first-child { margin-top: 0; }
        .card > :last-child { margin-bottom: 0; }

        /* The four steps of a cycle. */
        .rail {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1.5rem 0 0;
            padding: 0;
            counter-reset: step;
        }
        .rail li {
            counter-increment: step;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.9rem;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0.3rem 0.8rem 0.3rem 0.35rem;
        }
        .rail li::before {
            content: counter(step);
            display: grid;
            place-items: center;
            width: 1.4rem;
            height: 1.4rem;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--line-strong);
            font-size: 0.75rem;
            font-weight: 650;
        }
        .rail .step-done { color: var(--good); border-color: #bfe3cd; }
        .rail .step-done::before { content: "\2713"; background: var(--good); border-color: var(--good); color: #fff; }
        .rail .step-now { color: var(--ink); font-weight: 650; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .rail .step-now::before { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* The next action. The most important thing on a cycle page. */
        .next {
            background: var(--accent-soft);
            border: 1px solid #c8d4fb;
            border-radius: 12px;
            padding: 1.25rem 1.4rem;
            margin: 1rem 0 0;
        }
        .next > :first-child { margin-top: 0; }
        .next > :last-child { margin-bottom: 0; }
        .next-what { font-size: 1.15rem; font-weight: 650; margin-bottom: 0.4rem; }
        .next .note { color: #41506a; }

        /* Buttons. The primary action looks like the primary action. */
        .btn, button {
            display: inline-block;
            font: 600 1rem/1 var(--sans);
            color: #fff;
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 0.7rem 1.1rem;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover, button:hover { background: #1633a8; border-color: #1633a8; color: #fff; }
        .btn-quiet {
            color: var(--ink);
            background: var(--surface);
            border-color: var(--line-strong);
        }
        .btn-quiet:hover { background: var(--bg); color: var(--ink); border-color: var(--muted); }

        /* Forms */
        form { margin: 1rem 0 0; }
        .field { margin: 0 0 1.1rem; }
        label { display: block; font-weight: 600; font-size: 0.97rem; margin-bottom: 0.3rem; }
        .hint { display: block; font-weight: 400; color: var(--muted); font-size: 0.9rem; margin-bottom: 0.4rem; }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%;
            font: inherit;
            color: inherit;
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            padding: 0.6rem 0.7rem;
        }
        textarea { min-height: 7rem; line-height: 1.6; resize: vertical; }
        input:hover, textarea:hover, select:hover { border-color: var(--muted); }
        .field-row { display: grid; grid-template-columns: 1fr 10rem 8rem; gap: 0.75rem; }
        @media (max-width: 36rem) { .field-row { grid-template-columns: 1fr; } }

        code, .mono, pre { font-family: var(--mono); }
        code { font-size: 0.92em; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0.08em 0.35em; }
        pre {
            margin: 1rem 0;
            padding: 1rem 1.1rem;
            background: #0f1720;
            color: #e6edf3;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 0.88rem;
            line-height: 1.6;
        }
        pre code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
        .num { font-variant-numeric: tabular-nums; }
        .hash { font-family: var(--mono); font-size: 0.85rem; word-break: break-all; color: var(--muted); }
        .when { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.4rem; }

        /* Lists of things: claims, runs, cycles, units. */
        .rows { list-style: none; margin: 0; padding: 0; }
        .rows > li {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 1.1rem 1.25rem;
            margin: 0 0 0.75rem;
            display: grid;
            grid-template-columns: 2rem 1fr;
            gap: 0 0.5rem;
        }
        .rows > li > .idx { color: var(--muted); font-weight: 650; font-size: 0.9rem; }
        /* A syllabus of fifteen underlined links reads as a link dump. The row
           title is the heading of its row, so it is styled as one. */
        .rows > li > .body h4 a { color: var(--ink); text-decoration: none; }
        .rows > li > .body h4 a:hover { color: var(--accent); }
        .rows > li > .body > :first-child { margin-top: 0; }
        .rows > li > .body > :last-child { margin-bottom: 0; }

        /* A part of the course: a group of units with a reason to be together. */
        .part { margin: 1.75rem 0 0; }
        .part-head {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            flex-wrap: wrap;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--line-strong);
            margin-bottom: 0.9rem;
        }
        .part-head h4 { margin: 0; font-size: 1.12rem; }
        .part-no {
            color: var(--accent);
            background: var(--accent-soft);
            border-radius: 999px;
            padding: 0.15rem 0.6rem;
            font-size: 0.82rem;
            font-weight: 650;
            white-space: nowrap;
        }
        .part-count { margin-left: auto; color: var(--muted); font-size: 0.9rem; }
        .part > p { margin: 0.5rem 0; }
        .part .rows { margin-top: 0.9rem; }

        /* The single next thing to do. */
        .next-card { border-color: var(--line-strong); border-left: 4px solid var(--accent); }
        .next-card h4 { margin: 0 0 0.4rem; color: var(--muted); font-size: 0.9rem; font-weight: 650; }
        .next-title { margin: 0 0 0.3rem; font-size: 1.2rem; font-weight: 650; }
        .next-title a { color: var(--ink); text-decoration: none; }
        .next-title a:hover { color: var(--accent); }
        .next-card .btn { margin-top: 0.9rem; }

        /* Where a unit sits in the course. */
        .place { color: var(--muted); font-size: 0.9rem; margin: 0.35rem 0 0; }

        /* Label and value pairs. */
        .facts { margin: 0.75rem 0 0; display: grid; gap: 0.35rem; }
        .facts > div { display: grid; grid-template-columns: 8rem 1fr; gap: 0 1rem; align-items: baseline; }
        .facts dt, .facts .k { color: var(--muted); font-size: 0.9rem; }
        .facts dd, .facts .v { margin: 0; }
        @media (max-width: 36rem) { .facts > div { grid-template-columns: 1fr; } }

        /* Outcomes */
        .outcome { margin: 0.75rem 0 0; font-weight: 600; }
        .correct .outcome strong { color: var(--good); }
        .wrong .outcome strong { color: var(--warn); }
        .unresolved .outcome strong { color: var(--muted); }
        .correct { border-left: 4px solid var(--good); }
        .wrong { border-left: 4px solid var(--warn); }
        .unresolved { border-left: 4px solid var(--line-strong); }

        .reads { list-style: none; margin: 0.6rem 0 0; padding: 0; font-family: var(--mono); font-size: 0.9rem; }
        .reads li { padding: 0.15rem 0; }
        .reads .was { color: var(--muted); }

        /* Score block */
        dl.tally {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
            gap: 1rem;
            margin: 0;
        }
        dl.tally dt { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
        dl.tally dd { margin: 0.1rem 0 0; font-size: 1.6rem; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

        /* The cycle index */
        .index { list-style: none; margin: 0; padding: 0; }
        .index li {
            display: grid;
            grid-template-columns: 2.5rem 1fr auto;
            gap: 0 0.75rem;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            margin-bottom: 0.5rem;
        }
        .index .idx { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
        .index a { font-weight: 600; text-decoration: none; }

        .how { margin: 0.75rem 0 0; padding-left: 1.4rem; }
        .how li { margin-bottom: 0.4rem; }
        .how b { font-weight: 650; }

        .vocab { list-style: none; margin: 0.5rem 0 0; padding: 0; }
        .vocab li { padding: 0.3rem 0; border-bottom: 1px solid var(--line); font-size: 0.97rem; }
        .vocab li:last-child { border-bottom: 0; }

        .onward { display: flex; gap: 1.25rem; flex-wrap: wrap; margin: 1.5rem 0 0; }

        /* Glossary. The term and its full name sit together, because the full
           name is the point of the entry. */
        .glossary { margin: 0; }
        .glossary dt {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.2rem 0.6rem;
            margin: 1.5rem 0 0.3rem;
            padding-top: 1.1rem;
            border-top: 1px solid var(--line);
        }
        .glossary dt:first-of-type { border-top: 0; padding-top: 0; margin-top: 0.5rem; }
        .gl-term { font-family: var(--mono); font-weight: 650; font-size: 1.02rem; }
        .gl-expansion { color: var(--muted); }
        .glossary dd { margin: 0; }
        .glossary dd p { margin: 0 0 0.4rem; }
        .glossary .sources { margin: 0.3rem 0 0; }

        /* Units. A probe is a question you answer with a confidence before any
           answer is shown, so the options stay quiet until you have committed. */
        .brief p { max-width: 36rem; }
        .brief p:first-of-type { font-size: 1.12rem; }

        .probe-choices { list-style: none; margin: 0 0 1.25rem; padding: 0; }
        .probe-choices li { margin-bottom: 0.5rem; }
        .probe-choices label {
            display: flex;
            gap: 0.7rem;
            align-items: flex-start;
            font-weight: 400;
            margin: 0;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--line-strong);
            border-radius: 9px;
            cursor: pointer;
        }
        .probe-choices label:hover { border-color: var(--accent); background: var(--accent-soft); }
        .probe-choices input { margin: 0.4rem 0 0; flex: none; }
        .probe-choices .picked { border-color: var(--ink); background: var(--bg); }

        .confidence { display: grid; grid-template-columns: 9rem 1fr; gap: 1rem; align-items: end; }
        .confidence .hint { margin: 0; }
        @media (max-width: 36rem) { .confidence { grid-template-columns: 1fr; } }

        .verdict { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; margin: 0 0 0.75rem; }
        .badge {
            font: 650 0.8rem/1 var(--sans);
            letter-spacing: 0.03em;
            text-transform: uppercase;
            border-radius: 999px;
            padding: 0.35rem 0.7rem;
        }
        .badge-right { color: #0f5c2e; background: #dcf5e6; }
        .badge-wrong { color: #7c3d06; background: #fdeccd; }
        .verdict .said { color: var(--muted); font-size: 0.95rem; }

        .because {
            background: var(--bg);
            border-radius: 9px;
            padding: 1rem 1.1rem;
            margin: 0;
        }
        .because > :last-child { margin-bottom: 0; }

        .sources { font-size: 0.93rem; color: var(--muted); padding-left: 1.2rem; }
        .sources li { margin-bottom: 0.35rem; }

        .pills { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0 0; }
        .pill {
            font-size: 0.9rem;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0.35rem 0.8rem;
        }
        .pill b { color: var(--ink); font-weight: 650; }
        .pill-done { color: #0f5c2e; background: #dcf5e6; border-color: #bfe3cd; }
        .pill-done b { color: #0f5c2e; }
        .pill-warn { color: #7c3d06; background: #fdeccd; border-color: #f0d9a8; }
        .pill-warn b { color: #7c3d06; }

        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
        /* Progression.

           The scoreboard is deliberately quiet. A course about not trusting
           a number should not dress its own numbers up, so these read as
           figures on a page rather than as a game heads-up display: no
           gradients, no badges that glow, no colour that means nothing.

           Colour is spent on exactly one thing, the gap between confidence
           claimed and accuracy delivered, because that is the only cell on
           the page a reader can act on. Everything else is ink on surface. */

        .game-card { border-left: 3px solid var(--accent); }

        .game-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2.25rem;
            margin-bottom: 1.1rem;
        }

        .stat { display: flex; flex-direction: column; gap: 0.15rem; min-width: 9rem; }

        .stat-label {
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stat-big {
            font: 600 1.7rem/1.15 var(--sans);
            color: var(--ink);
        }

        .verdict { color: var(--ink); }

        /* The calibration table. Right-aligned figures so the claimed and
           delivered columns can be compared by eye down the column, which is
           the comparison the table exists to make. */
        table.calib {
            border-collapse: collapse;
            width: 100%;
            margin: 0.4rem 0 0.7rem;
            font-size: 0.95rem;
        }

        table.calib th {
            text-align: left;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--line-strong);
            padding: 0.3rem 0.6rem 0.3rem 0;
        }

        table.calib td {
            padding: 0.35rem 0.6rem 0.35rem 0;
            border-bottom: 1px solid var(--line);
            font-variant-numeric: tabular-nums;
        }

        table.calib th:not(:first-child),
        table.calib td:not(:first-child) { text-align: right; padding-right: 0; }

        /* The one place colour carries meaning: delivered accuracy sitting
           more than ten points under the confidence claimed. --warn on
           --surface is 4.8:1, which clears the 4.5:1 floor for body text. */
        table.calib td.gap { color: var(--warn); font-weight: 600; }

        .badges { list-style: none; margin: 0.3rem 0 0; padding: 0; }

        .badges li {
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            padding: 0.45rem 0 0.45rem 1.4rem;
            border-bottom: 1px solid var(--line);
            position: relative;
        }

        .badges li:last-child { border-bottom: 0; }

        /* The marker is a character, not colour alone, so an earned badge is
           distinguishable without seeing hue. */
        .badges li::before {
            position: absolute;
            left: 0;
            top: 0.45rem;
            font-weight: 700;
        }

        .badge-on::before { content: "\2713"; color: var(--good); }
        /* --muted rather than --line-strong: this marker reports a state, so
           it has to be perceivable. The lighter rule colour measures 1.48:1
           on a card, which is a boundary you can draw and not a mark anybody
           can see. */
        .badge-off::before { content: "\2219"; color: var(--muted); }
        .badge-off b { color: var(--muted); font-weight: 600; }

        /* Also a state, also --muted, for the same reason. */
        /* The role_asks list on the syllabus. Tight, because it is a
           reference the reader scans rather than reads. */
        ul.asks { margin: 0.2rem 0 0.8rem; padding-left: 1.1rem; }
        ul.asks li { color: var(--muted); font-size: 0.95rem; margin-bottom: 0.15rem; }

        .locked-card { border-left: 3px solid var(--muted); }
        .locked-card h4 { margin-top: 0; }

        @media (max-width: 34rem) {
            .game-grid { gap: 1.25rem; }
            .stat { min-width: 7rem; }
            .stat-big { font-size: 1.4rem; }

            /* Five nav items do not fit on a phone. Without wrapping, the
               masthead sets a floor on the page width and every other
               element inherits the overflow, which reads as the whole site
               being cut off rather than as one row being too long. */
            .masthead { flex-wrap: wrap; gap: 0.5rem 1rem; }
            .masthead nav { flex-wrap: wrap; gap: 0.6rem 1rem; }

            /* A long title has nowhere to break on a narrow column. */
            h2 { font-size: 1.5rem; }

            .calib { font-size: 0.86rem; }
            .calib th { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div class="sheet">
        <header class="masthead">
            <span class="name"><a href="/">AI Eval Gym</a></span>
            <nav>
                <a href="/">Course</a>
                <a href="/units">Syllabus</a>
                <a href="/review">Review</a>
                <a href="/cycles">Cycles</a>
                <a href="/glossary">Glossary</a>
            </nav>
            <span class="where">{% block where %}{% endblock %}</span>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
